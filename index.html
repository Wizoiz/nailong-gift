<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD84D">
<meta name="description" content="立冬 / 冬至的奶龙搞怪礼物页，收下就蹦迪">
<!-- PWA：可添加到主屏，像小程序一样常驻 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="奶龙送礼">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>奶龙来送礼了</title>
<style>
  :root{
    --ink:#1B1B1B;
    --yellow:#FFD84D;
    --yellow-d:#EDB92C;
    --pink:#FF9BC2;
    --cream:#FFF9E8;
    --bounce:.968s;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;
    background:
      radial-gradient(circle at 18% 10%,#FFFDF3 0%,transparent 55%),
      radial-gradient(circle at 84% 82%,#FFE3EF 0%,transparent 60%),
      linear-gradient(160deg,#FFF4D2 0%,#FFEBD4 46%,#FFE1EE 100%);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .stage{position:relative;z-index:1;min-height:100dvh;display:grid;place-items:center;padding:22px 16px 30px}
  .screen{display:none;width:100%;place-items:center}
  .screen.on{display:grid}

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;width:min(88vw,382px);
    background:#fff;border:4px solid var(--ink);border-radius:30px;
    box-shadow:9px 9px 0 var(--ink);
    padding:66px 24px 24px;text-align:center;
    transform:rotate(-.7deg);
  }
  .hero{display:flex;justify-content:center;margin-bottom:-6px;position:relative;z-index:2}
  .hero svg{width:min(46vw,168px);height:auto;display:block;overflow:visible}

  .kicker{
    display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;
    background:var(--yellow);border:3px solid var(--ink);border-radius:999px;
    padding:4px 13px;transform:rotate(-2deg);
  }
  h1{font-size:clamp(24px,7.2vw,30px);line-height:1.2;font-weight:900;margin:15px 0 10px}
  h1 .hl{background:linear-gradient(180deg,transparent 60%,var(--yellow) 60%,var(--yellow) 96%,transparent 96%)}
  p.ask{font-size:15.5px;line-height:1.75;color:#555;margin:0 0 22px}
  .hint{font-size:12px;color:#AAA;margin:12px 0 0;min-height:16px}

  .btn{
    display:block;width:100%;padding:15px;font-size:17px;font-weight:900;
    border:4px solid var(--ink);border-radius:18px;cursor:pointer;
    font-family:inherit;color:var(--ink);
    transition:transform .14s cubic-bezier(.34,1.56,.64,1),box-shadow .14s;
  }
  .btn-main{background:var(--yellow);box-shadow:5px 5px 0 var(--ink);margin-bottom:13px}
  .btn-main:hover{transform:translate(-2px,-2px) scale(1.02);box-shadow:7px 7px 0 var(--ink)}
  .btn-main:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
  .btn-ghost{
    background:#fff;border-style:dashed;border-color:#BDBDBD;color:#8A8A8A;
    font-size:13.5px;font-weight:700;padding:11px;box-shadow:none;
  }
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink)}
  #rejectBtn{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}

  /* ---------- 奶龙（真实素材 · 内嵌 WebP） ---------- */
  .hero img{
    display:block;width:auto;max-width:100%;object-fit:contain;
    -webkit-user-drag:none;user-select:none;
    filter:drop-shadow(0 9px 0 rgba(27,27,27,.10));
  }
  #dragonAsk img{height:clamp(132px,31vw,178px)}
  #dragonReject img{height:clamp(132px,31vw,178px);filter:saturate(.4) brightness(.97) drop-shadow(0 9px 0 rgba(27,27,27,.08))}
  #dragonGift img{height:clamp(112px,26vw,148px)}
  #dragonAsk img,#dragonReject img{animation:floaty 3.4s ease-in-out infinite}
  #dragonGift img{animation:bounce var(--bounce) cubic-bezier(.28,.9,.4,1) infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-9px) rotate(1.6deg)}}
  @keyframes bounce{
    0%,100%{transform:translateY(0) scaleY(1) scaleX(1)}
    18%{transform:translateY(-22px) scaleY(1.05) scaleX(.96)}
    50%{transform:translateY(0) scaleY(.9) scaleX(1.08)}
    62%{transform:translateY(2px) scaleY(1.02) scaleX(.99)}
  }
  /* 泪滴 */
  .nlbox{position:relative;display:inline-flex;animation:floaty 3.4s ease-in-out infinite}
  #dragonReject .nlbox img{animation:none}
  .tears{
    position:absolute;inset:0;
    pointer-events:none;display:none;
  }
  #screenReject .tears{display:block}
  .tears i{
    position:absolute;left:64.4%;margin-left:-5px;top:9.5%;
    width:10px;height:14px;background:#8FD8FF;z-index:5;
    border:2.5px solid var(--ink);border-radius:0 0 50% 50%/0 0 62% 62%;
    animation:tearfall 1.9s ease-in-out infinite;
  }
  .tears i:nth-child(n+2){display:none}
  @keyframes tearfall{
    0%{opacity:.98;transform:translateY(-3px) scale(.75)}
    45%{opacity:.98;transform:translateY(7px) scale(1)}
    100%{opacity:0;transform:translateY(18px) scale(.96)}
  }
  .squish{animation:squish .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.14,.84)}70%{transform:scale(.94,1.08)}100%{transform:scale(1)}}

  /* ---------- 迪斯科 ---------- */
  .disco{
    position:absolute;left:50%;top:46%;width:760px;height:760px;
    transform:translate(-50%,-50%);pointer-events:none;z-index:0;
    background:repeating-conic-gradient(from 0deg,
      rgba(255,196,0,.85) 0deg 7deg, transparent 7deg 15deg,
      rgba(255,107,168,.75) 15deg 22deg, transparent 22deg 30deg);
    -webkit-mask:radial-gradient(circle,#000 30%,transparent 74%);
    mask:radial-gradient(circle,#000 30%,transparent 74%);
    animation:spin 16s linear infinite;
  }
  .screen.on > .card{position:relative;z-index:2}
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .hero-wrap{position:relative;display:flex;justify-content:center}
  .deck{
    width:76px;height:76px;position:absolute;right:4px;top:6px;
    transform:rotate(-12deg);z-index:4;
  }
  .deck .platter{
    width:100%;height:100%;border-radius:50%;
    border:4px solid var(--ink);background:#2A2A2A;
    box-shadow:4px 4px 0 var(--ink);
    display:grid;place-items:center;position:relative;
    animation:spin2 1.2s linear infinite;
  }
  @keyframes spin2{to{transform:rotate(360deg)}}
  .deck .platter::before{
    content:"";position:absolute;inset:12px;border-radius:50%;
    background:repeating-radial-gradient(circle,#3A3A3A 0 2px,#242424 2px 4px);
  }
  .deck .label{
    position:relative;width:38%;height:38%;border-radius:50%;
    background:var(--yellow);border:3px solid var(--ink);
    display:grid;place-items:center;font-size:10px;font-weight:900;
  }
  .deck .needle{
    position:absolute;right:-11px;top:-8px;width:34px;height:34px;
    border-top:5px solid var(--ink);border-right:5px solid var(--ink);
    border-radius:0 8px 0 0;transform-origin:100% 0;
    animation:needle 1.2s ease-in-out infinite alternate;
  }
  @keyframes needle{from{transform:rotate(-14deg)}to{transform:rotate(4deg)}}

  /* ---------- 漂浮表情 ---------- */
  .bubble{
    position:absolute;font-size:15px;font-weight:900;color:var(--ink);
    background:#fff;border:3px solid var(--ink);border-radius:999px;
    padding:2px 10px;pointer-events:none;z-index:4;
    animation:pop 1.5s ease-out forwards;
  }
  @keyframes pop{
    0%{opacity:0;transform:translateY(6px) scale(.6) rotate(-8deg)}
    22%{opacity:1;transform:translateY(-4px) scale(1.06) rotate(3deg)}
    100%{opacity:0;transform:translateY(-58px) scale(.9) rotate(-6deg)}
  }

  /* ---------- 工具按钮 ---------- */
  .corner{
    position:fixed;z-index:20;border:3px solid var(--ink);background:#fff;
    border-radius:14px;font-family:inherit;font-weight:800;color:var(--ink);
    box-shadow:3px 3px 0 var(--ink);cursor:pointer;padding:9px 13px;font-size:14px;
  }
  .corner:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  #sfxBtn{top:16px;right:16px;width:44px;height:44px;padding:0;font-size:18px;border-radius:50%}
  #tempoBtn{top:16px;left:16px;display:none}
  #tempoBtn.on{display:block}
  #makerBtn{
    right:0;top:50%;transform:translateY(-50%);
    border-radius:14px 0 0 14px;border-right:0;padding:14px 9px;
    writing-mode:vertical-rl;letter-spacing:.24em;font-size:13px;background:var(--yellow);
  }
  #makerBtn:active{transform:translateY(-50%) translateX(2px)}
  body.opened #makerBtn{background:#fff}
  #installBtn{
    top:auto;bottom:calc(50% + 104px);
    background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
    padding:9px 13px;border-radius:999px;font:800 13px/1 var(--font);
    color:var(--ink);cursor:pointer;z-index:12;
    display:none;
  }
  #installBtn[hidden]{display:none}
  #installBtn.show{display:inline-flex;align-items:center;gap:5px}

  /* ---------- 制作面板 ---------- */
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:#fff;border-top:4px solid var(--ink);
    border-radius:26px 26px 0 0;padding:20px 20px 26px;
    box-shadow:0 -6px 0 rgba(27,27,27,.08);
    transform:translateY(102%);transition:transform .34s cubic-bezier(.34,1.3,.64,1);
    max-height:88dvh;overflow:auto;
  }
  #sheet.on{transform:translateY(0)}
  #sheet h3{margin:0 0 14px;font-size:17px;font-weight:900}
  .field{margin-bottom:12px;text-align:left}
  .field label{display:block;font-size:12px;font-weight:800;color:#777;margin-bottom:5px}
  .field input{
    width:100%;padding:11px 13px;border:3px solid var(--ink);border-radius:13px;
    font-size:15px;font-family:inherit;color:var(--ink);background:var(--cream);
  }
  .field input:focus{outline:none;background:#fff;box-shadow:3px 3px 0 var(--yellow)}
  .seg{display:flex;gap:9px}
  .seg button{
    flex:1;padding:10px;border:3px solid var(--ink);border-radius:13px;background:#fff;
    font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;color:#777;
  }
  .seg button.on{background:var(--yellow);color:var(--ink)}
  .row{display:flex;gap:10px;margin-top:12px}
  .row .btn{margin:0;font-size:15px;padding:13px}
  .linkout{
    margin-top:12px;padding:10px 12px;border:3px dashed #CCC;border-radius:12px;
    font-size:11.5px;color:#888;word-break:break-all;text-align:left;display:none;
    font-family:ui-monospace,Consolas,monospace;background:#FAFAFA;
  }
  .linkout.on{display:block}
  #closeSheet{
    position:absolute;top:16px;right:18px;border:0;background:none;font-size:22px;
    cursor:pointer;color:#999;font-family:inherit;line-height:1;
  }
  body.shake{animation:shk .42s}
  @keyframes shk{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-7px,4px) rotate(-.6deg)}
    40%{transform:translate(6px,-5px) rotate(.5deg)}
    60%{transform:translate(-4px,3px) rotate(-.3deg)}
    80%{transform:translate(3px,-2px)}
  }
  @media (prefers-reduced-motion:reduce){
    .disco,.deck .platter,#dragonGift svg{animation:none!important}
  }
</style>
</head>

  <div class="field"><label>送给谁</label><input id="fTo" maxlength="12" placeholder="比如：小明"></div>
  <div class="field"><label>谁送的</label><input id="fFrom" maxlength="12" placeholder="比如：你最好的朋友"></div>
  <div class="field"><label>一句话（可留空）</label><input id="fWish" maxlength="28" placeholder="天冷了，记得多穿点"></div>
  <div class="field"><label>主题</label>
    <div class="seg" id="seg">
      <button data-theme="lidong" class="on">立冬 11·07</button>
      <button data-theme="dongzhi">冬至 12·21</button>
    </div>
  </div>
  <div class="linkout" id="linkOut"></div>
  <div class="row">
    <button class="btn btn-main" id="makeBtn">生成链接</button>
    <button class="btn btn-ghost" id="copyBtn">复制</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- 文案 ---------- */
  const COPY = {
    lidong:{
      kicker:'11·07 立冬',
      title:'奶龙来送礼了',
      ask:'有一只野生奶龙<br>叼着礼物蹲在你门口',
      accept:'收下（求你了）',
      giftSub:'已自动开启蹦迪模式<br>笑声别停，停了它会不高兴'
    },
    dongzhi:{
      kicker:'12·21 冬至',
      title:'奶龙来送饺子了',
      ask:'有一只野生奶龙<br>端着一碗热饺子在门口',
      accept:'收下（趁热）',
      giftSub:'已自动开启蹦迪模式<br>笑声别停，饺子管够'
    }
  };

  const qs = new URLSearchParams(location.search);
  const P = {
    to: (qs.get('to')||'').trim(),
    from: (qs.get('from')||'').trim(),
    wish: (qs.get('wish')||'').trim(),
    theme: COPY[qs.get('theme')] ? qs.get('theme') : 'lidong'
  };


  /* ---------- DOM ---------- */
  const screens = {
    ask: document.getElementById('screenAsk'),
    reject: document.getElementById('screenReject'),
    gift: document.getElementById('screenGift')
  };
  const askText = document.getElementById('askText');
  const askHint = document.getElementById('askHint');
  const giftSub = document.getElementById('giftSub');
  const giftHint = document.getElementById('giftHint');
  const acceptBtn = document.getElementById('acceptBtn');
  const rejectBtn = document.getElementById('rejectBtn');
  const reopenBtn = document.getElementById('reopenBtn');
  const againBtn = document.getElementById('againBtn');
  const shareBtn = document.getElementById('shareBtn');
  const themeBtn = document.getElementById('tempoBtn');

  function show(name){
    Object.keys(screens).forEach(function(k){ screens[k].classList.toggle('on', k === name); });
    document.body.classList.toggle('opened', name === 'gift');
    themeBtn.classList.toggle('on', name === 'gift');
  }

  function applyCopy(){
    const c = COPY[P.theme];
    document.getElementById('kicker').textContent = c.kicker;
    document.getElementById('titleMain').textContent = c.title;
    askText.innerHTML = (P.to ? '<b>' + esc(P.to) + '</b>，' : '') + c.ask;
    acceptBtn.textContent = c.accept;
    giftSub.innerHTML = P.wish ? esc(P.wish) + '<br>' + c.giftSub.split('<br>')[1] : c.giftSub;
    if(P.to) document.title = c.title + ' · 给 ' + P.to;
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];
    });
  }
  applyCopy();

  /* ---------- 声音 ---------- */
  let ac = null, master = null, musicOn = false, sfxOn = true;
  const MUS = { bpm:124, rate:1, step:0, next:0, timer:null };

  function initAudio(){
    if(ac) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    ac = new C();
    master = ac.createGain();
    master.gain.value = .55;
    master.connect(ac.destination);
  }

  function env(node, t, peak, dur, attack){
    const g = node.gain;
    g.setValueAtTime(.0001, t);
    g.exponentialRampToValueAtTime(peak, t + (attack||.006));
    g.exponentialRampToValueAtTime(.0001, t + dur);
  }

  function tone(type, f0, f1, t, dur, vol){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if(f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur * .9);
    env(g, t, vol, dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + .05);
  }

  function noiseBurst(t, dur, vol, hp){
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 6000;
    const g = ac.createGain(); env(g, t, vol, dur, .002);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t); src.stop(t + dur + .02);
  }

  function sfx(kind){
    if(!ac || !sfxOn) return;
    const t = ac.currentTime + .01;
    if(kind === 'boing'){ tone('sine', 190, 760, t, .16, .22); tone('sine', 760, 320, t + .12, .18, .16); }
    else if(kind === 'pip'){ tone('square', 920, 1180, t, .05, .1); }
    else if(kind === 'duang'){ tone('triangle', 120, 62, t, .3, .34); noiseBurst(t, .1, .1, 2400); }
    else if(kind === 'wah'){ tone('sawtooth', 480, 150, t, .5, .2); tone('sawtooth', 470, 145, t + .02, .5, .16); }
    else if(kind === 'yay'){
      [0, 4, 7, 12].forEach(function(n, i){
        tone('triangle', 440 * Math.pow(2, n / 12), 0, t + i * .075, .18, .2);
      });
    }
  }

  /* ---------- 笑声 BGM（内嵌原站那段大笑） ---------- */
  const bgm = document.getElementById('bgm');

  function startMusic(){
    if(!bgm) return;
    if(musicOn) return;
    musicOn = true;
    bgm.currentTime = 0;
    bgm.playbackRate = MUS.rate;
    bgm.muted = !sfxOn;
    bgm.volume = .95;
    const p = bgm.play();
    if(p && p.catch) p.catch(function(){});
    updateBounce();
  }
  function stopMusic(){
    musicOn = false;
    if(bgm){ try{ bgm.pause(); }catch(e){} }
  }
  function updateBounce(){
    const sec = (60 / (MUS.bpm * MUS.rate)) * 2;
    document.documentElement.style.setProperty('--bounce', sec.toFixed(3) + 's');
  }

  /* ---------- 粒子背景 ---------- */
  const cvs = document.getElementById('bg');
  const ctx = cvs.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  const dots = [], notes = [], confetti = [];
  const GLYPHS = ['♪','♫','♩','♬','✦','●'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.floor(W * DPR); cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function seed(){
    dots.length = 0; notes.length = 0;
    const nd = reduce ? 26 : 54;
    for(let i = 0; i < nd; i++){
      dots.push({ x: Math.random()*W, y: Math.random()*H, r: 2 + Math.random()*5,
        a: .1 + Math.random()*.18, vy: -.1 - Math.random()*.25, vx: (Math.random()-.5)*.2 });
    }
    const nn = reduce ? 4 : 11;
    for(let i = 0; i < nn; i++){
      notes.push({ x: Math.random()*W, y: Math.random()*H, g: GLYPHS[i % GLYPHS.length],
        s: 12 + Math.random()*16, vy: -.25 - Math.random()*.5, rot: Math.random()*6.28,
        vr: (Math.random()-.5)*.02, a: .12 + Math.random()*.2 });
    }
  }
  seed();

  function burst(){
    const colors = ['#FFD84D','#FF9BC2','#8FD8FF','#B6F09C','#FFB86B','#C9A6FF'];
    for(let i = 0; i < 54; i++){
      confetti.push({
        x: W/2 + (Math.random()-.5)*Math.min(W*.6, 460),
        y: H*.40,
        vx: (Math.random()-.5)*10,
        vy: -9 - Math.random()*9,
        g: .34 + Math.random()*.18,
        r: Math.random()*6.28, vr: (Math.random()-.5)*.42,
        s: 5 + Math.random()*9,
        c: colors[i % colors.length],
        life: 1
      });
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    for(const d of dots){
      d.y += d.vy; d.x += d.vx;
      if(d.y < -12){ d.y = H + 12; d.x = Math.random()*W; }
      if(d.x < -12) d.x = W + 12; else if(d.x > W+12) d.x = -12;
      ctx.beginPath();
      ctx.fillStyle = 'rgba(237,185,44,' + d.a + ')';
      ctx.arc(d.x, d.y, d.r, 0, 6.2832);
      ctx.fill();
    }

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(const n of notes){
      n.y += n.vy * (musicOn ? 2.1 : 1); n.rot += n.vr;
      if(n.y < -30){ n.y = H + 30; n.x = Math.random()*W; }
      ctx.save();
      ctx.translate(n.x, n.y); ctx.rotate(n.rot);
      ctx.globalAlpha = n.a * (musicOn ? 1.9 : 1);
      ctx.fillStyle = '#E8A93A';
      ctx.font = '700 ' + n.s + 'px system-ui,sans-serif';
      ctx.fillText(n.g, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    for(let i = confetti.length - 1; i >= 0; i--){
      const p = confetti[i];
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      p.vx *= .995;
      if(p.y > H + 40 || p.life <= 0){ confetti.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*.66);
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- 漂浮表情 ---------- */
  const WORDS = ['嗯？','嗷','嘿嘿','？','哇哦','好吃','蹦','别走'];
  let bubbleTimer = null;
  function bubble(){
    const host = screens[document.body.classList.contains('opened') ? 'gift' : 'ask'].querySelector('.hero');
    if(!host) return;
    const el = document.createElement('span');
    el.className = 'bubble';
    el.textContent = WORDS[Math.floor(Math.random()*WORDS.length)];
    el.style.left = (28 + Math.random()*44) + '%';
    el.style.top = (6 + Math.random()*34) + '%';
    host.appendChild(el);
    setTimeout(function(){ el.remove(); }, 1600);
  }
  bubbleTimer = setInterval(function(){ if(!document.hidden) bubble(); }, 2600);

  /* ---------- 交互 ---------- */
  let dodges = 0;

  acceptBtn.addEventListener('pointerenter', function(){
    initAudio(); if(!sfxOn) return;
    if(ac && ac.state === 'suspended') ac.resume();
    sfx('pip');
  });

  acceptBtn.addEventListener('click', function(){
    initAudio();
    if(ac && ac.state === 'suspended') ac.resume();
    sfx('yay');
    burst();
    document.body.classList.add('shake');
    setTimeout(function(){ document.body.classList.remove('shake'); }, 460);
    setTimeout(function(){ show('gift'); startMusic(); }, 220);
  });

  function dodge(){
    dodges++;
    const mx = Math.min(150, window.innerWidth * .28);
    const my = 80;
    const x = (Math.random()*2 - 1) * mx;
    const y = (Math.random()*2 - 1) * my;
    rejectBtn.style.transform = 'translate(' + x.toFixed(0) + 'px,' + y.toFixed(0) + 'px) rotate(' + ((Math.random()*2-1)*16).toFixed(0) + 'deg)';
    sfx('pip');
    if(dodges === 1) askHint.textContent = '（咦，它刚才躲了一下）';
    if(dodges === 2) askHint.textContent = '（它还在躲，但明显慢了）';
    if(dodges >= 3){ askHint.textContent = '（算了，放过它吧）'; }
  }

  rejectBtn.addEventListener('pointerenter', function(e){
    initAudio();
    if(dodges < 3) dodge();
  });

  rejectBtn.addEventListener('click', function(e){
    initAudio();
    if(dodges < 2){ e.preventDefault(); dodge(); return; }
    sfx('wah');
    show('reject');
  });

  reopenBtn.addEventListener('click', function(){
    sfx('boing');
    dodges = 0;
    rejectBtn.style.transform = '';
    askHint.textContent = '';
    show('ask');
  });

  againBtn.addEventListener('click', function(){
    sfx('boing');
    stopMusic();
    dodges = 0;
    rejectBtn.style.transform = '';
    askHint.textContent = '';
    show('ask');
  });

  shareBtn.addEventListener('click', async function(){
    const c = COPY[P.theme];
    const line = (P.to ? P.to + '，' : '') + c.title + '！' + (P.wish || '天冷了，记得多穿点') + (P.from ? ' —— ' + P.from : '');
    try{
      await navigator.clipboard.writeText(line + '\n' + location.href);
      giftHint.textContent = '已复制，直接粘给对方就行';
    }catch(err){
      giftHint.textContent = line;
    }
    sfx('pip');
  });

  themeBtn.addEventListener('click', function(){
    MUS.rate = MUS.rate === 1 ? 2 : MUS.rate === 2 ? 4 : MUS.rate === 4 ? 8 : 1;
    themeBtn.textContent = '🎵 ' + MUS.rate + '×';
    if(bgm) bgm.playbackRate = MUS.rate;
    updateBounce();
    sfx('pip');
  });

  const sfxBtn = document.getElementById('sfxBtn');
  sfxBtn.addEventListener('click', function(){
    initAudio(); if(ac && ac.state === 'suspended') ac.resume();
    sfxOn = !sfxOn;
    sfxBtn.textContent = sfxOn ? '🔊' : '🔇';
    master.gain.value = sfxOn ? .55 : 0;
    if(bgm){ bgm.muted = !sfxOn; if(sfxOn && musicOn) bgm.play().catch(function(){}); }
  });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      if(ac && ac.state === 'running') ac.suspend();
      if(bgm && musicOn) bgm.pause();
    }else{
      if(ac && ac.state === 'suspended') ac.resume();
      if(bgm && musicOn) bgm.play().catch(function(){});
    }
  });

  /* ---------- 制作面板 ---------- */
  const sheet = document.getElementById('sheet');
  const linkOut = document.getElementById('linkOut');
  const fTo = document.getElementById('fTo');
  const fFrom = document.getElementById('fFrom');
  const fWish = document.getElementById('fWish');
  let theme = P.theme;

  document.getElementById('makerBtn').addEventListener('click', function(){
    initAudio(); sfx('pip');
    sheet.classList.add('on');
  });
  document.getElementById('closeSheet').addEventListener('click', function(){
    sheet.classList.remove('on');
  });
  document.querySelectorAll('#seg button').forEach(function(b){
    b.addEventListener('click', function(){
      theme = b.dataset.theme;
      document.querySelectorAll('#seg button').forEach(function(x){ x.classList.toggle('on', x === b); });
    });
  });

  document.getElementById('makeBtn').addEventListener('click', function(){
    const to = fTo.value.trim(), from = fFrom.value.trim(), wish = fWish.value.trim();
    const p = new URLSearchParams();
    if(to) p.set('to', to);
    if(from) p.set('from', from);
    if(wish) p.set('wish', wish);
    p.set('theme', theme);
    const url = location.origin + location.pathname + '?' + p.toString();
    history.replaceState(null, '', '?' + p.toString());
    linkOut.textContent = url;
    linkOut.classList.add('on');
    P.to = to; P.from = from; P.wish = wish; P.theme = theme;
    applyCopy();
    sfx('boing');
  });

  document.getElementById('copyBtn').addEventListener('click', async function(){
    if(!linkOut.textContent) return;
    try{
      await navigator.clipboard.writeText(linkOut.textContent);
      linkOut.textContent = '已复制 ✓';
      setTimeout(function(){ linkOut.textContent = ''; }, 1200);
    }catch(err){
      const r = document.createRange(); r.selectNodeContents(linkOut);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    }
  });

  /* PWA：装到主屏（安卓 Chrome / 桌面 Edge 走 beforeinstallprompt；iOS 走提示） */
  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    if (installBtn) installBtn.classList.add('show');
  });
  if (installBtn) {
    installBtn.addEventListener('click', function(){
      if (!deferredPrompt) {
        alert('iPhone / iPad：点底部「分享」→「添加到主屏幕」\n安卓 / 电脑：浏览器菜单里选「安装应用」');
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){
        deferredPrompt = null;
        installBtn.classList.remove('show');
      });
    });
  }
  window.addEventListener('appinstalled', function(){
    if (installBtn) installBtn.classList.remove('show');
  });
  /* iOS Safari 没有 beforeinstallprompt：直接给个常驻入口 */
  (function(){
    var ua = navigator.userAgent;
    var iOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (iOS && !standalone && installBtn) installBtn.classList.add('show');
  })();

  /* PWA：注册 Service Worker，装上主屏后可离线打开 */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function () {});
    });
  }

  /* 首次点击任意处解锁音频 */
  document.addEventListener('pointerdown', function once(){
    initAudio();
    if(ac && ac.state === 'suspended') ac.resume();
    document.removeEventListener('pointerdown', once);
  });
})();
</script>
</body>
</html>
